<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>US Trending Sounds — TikTok</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14171c;
        --panel-2: #1a1e25;
        --line: #232830;
        --ink: #e8eaed;
        --muted: #8a93a0;
        --accent: #ff3b6c;
        --accent-2: #4ad1e0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 28px 32px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }
      header .title h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
      header .title .sub { color: var(--muted); font-size: 13px; }
      header .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .badge {
        font-size: 12px;
        padding: 5px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
      }
      .badge.live::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        background: var(--accent-2);
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: middle;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      main { padding: 20px 32px 64px; }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .pill {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 7px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
      }
      .pill.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      input.search {
        flex: 1;
        min-width: 260px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 9px 14px;
        border-radius: 8px;
        font-size: 13px;
      }

      /* Card grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        transition: border-color 0.15s;
      }
      .card:hover { border-color: #3a4350; }
      .card .rank {
        font-size: 18px;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 28px;
        padding-top: 2px;
      }
      .card .cover {
        width: 64px;
        height: 64px;
        border-radius: 8px;
        background: var(--panel-2);
        flex-shrink: 0;
        object-fit: cover;
      }
      .card .body { flex: 1; min-width: 0; }
      .card .title {
        font-weight: 600;
        font-size: 14px;
        margin: 0 0 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .artist {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .uses {
        color: var(--accent-2);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        margin-bottom: 10px;
      }
      .card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .card a.btn {
        text-decoration: none;
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 6px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .card a.btn:hover { border-color: var(--accent); color: var(--accent); }
      .card a.btn.ig { color: #e1306c; border-color: #4a2733; }
      .card a.btn.ig:hover { background: #2a1620; }

      .empty {
        padding: 80px 20px;
        text-align: center;
        color: var(--muted);
        background: var(--panel);
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .empty h3 { color: var(--ink); margin: 0 0 6px; }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>US Trending Sounds</h1>
        <div class="sub" id="meta">Loading…</div>
      </div>
      <div class="badges">
        <span class="badge live" id="freshBadge">Auto-refresh every 4 hours</span>
        <span class="badge" id="regionBadge">Region: US</span>
      </div>
    </header>
    <main>
      <div class="controls">
        <button class="pill active" data-period="7">Past 7 days</button>
        <button class="pill" data-period="30">Past 30 days</button>
        <button class="pill" data-period="120">Past 120 days</button>
        <input class="search" id="search" placeholder="Search title or artist…" />
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <h3>No sounds yet</h3>
        <p>Data is refreshed automatically every 4 hours by GitHub Actions. If you’re seeing this, the latest scrape returned no sounds — check the Actions tab on the repo.</p>
      </div>
    </main>

    <script>
      let DATA = { sounds: [], scraped_at: "" };
      let period = 7;
      let query = "";

      const fmt = (n) => {
        n = Number(n) || 0;
        if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
        return String(n);
      };

      const igSearch = (s) =>
        `https://www.google.com/search?q=${encodeURIComponent(
          `"${s.title}" ${s.artist} site:instagram.com/reels/audio`
        )}`;

      function escape(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );
      }

      function render() {
        const grid = document.getElementById("grid");
        const empty = document.getElementById("empty");
        const q = query.toLowerCase();
        const filtered = DATA.sounds
          .filter((s) => s.period_days === period)
          .filter(
            (s) =>
              !q ||
              (s.title || "").toLowerCase().includes(q) ||
              (s.artist || "").toLowerCase().includes(q)
          )
          .sort((a, b) => (a.rank || 9999) - (b.rank || 9999));

        grid.innerHTML = filtered
          .map(
            (s) => `
          <div class="card">
            <div class="rank">${s.rank || "—"}</div>
            ${
              s.cover
                ? `<img class="cover" src="${s.cover}" loading="lazy" alt="" />`
                : `<div class="cover"></div>`
            }
            <div class="body">
              <div class="title" title="${escape(s.title)}">${escape(s.title) || "—"}</div>
              <div class="artist" title="${escape(s.artist)}">${escape(s.artist) || "—"}</div>
              ${s.tiktok_uses ? `<div class="uses">${fmt(s.tiktok_uses)} videos</div>` : ""}
              <div class="actions">
                ${
                  s.tiktok_link
                    ? `<a class="btn" href="${s.tiktok_link}" target="_blank" rel="noopener">TikTok</a>`
                    : ""
                }
                <a class="btn ig" href="${igSearch(s)}" target="_blank" rel="noopener">Find on Instagram</a>
              </div>
            </div>
          </div>`
          )
          .join("");
        grid.hidden = filtered.length === 0;
        empty.hidden = filtered.length > 0;
      }

      document.querySelectorAll(".pill").forEach((b) =>
        b.addEventListener("click", () => {
          document.querySelectorAll(".pill").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          period = Number(b.dataset.period);
          render();
        })
      );
      document.getElementById("search").addEventListener("input", (e) => {
        query = e.target.value;
        render();
      });

      function relativeTime(iso) {
        const t = new Date(iso).getTime();
        const diff = (Date.now() - t) / 1000;
        if (diff < 60) return "just now";
        if (diff < 3600) return `${Math.round(diff / 60)} min ago`;
        if (diff < 86400) return `${Math.round(diff / 3600)} hr ago`;
        return `${Math.round(diff / 86400)} days ago`;
      }

      fetch("trending.json?_=" + Date.now())
        .then((r) => r.json())
        .then((d) => {
          DATA = d;
          const total = d.sounds.length;
          document.getElementById("meta").textContent =
            `${total} sounds tracked • Updated ${relativeTime(d.scraped_at)}`;
          render();
        })
        .catch((e) => {
          document.getElementById("meta").textContent = "Failed to load data: " + e;
        });
    </script>
  </body>
</html>
